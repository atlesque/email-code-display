<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f4f4f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111210"
      media="(prefers-color-scheme: dark)"
    />
    <title>Email Code Display</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3" />
            <path d="M7 12h2M11 12h2M15 12h2" />
          </svg>
          <span>Email Code Display</span>
        </a>
        <a
          class="icon-button"
          href="https://github.com/atlesque/email-code-display"
          aria-label="Source on GitHub"
          title="Source on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6 2 12l6 6M16 6l6 6-6 6" />
          </svg>
        </a>
      </header>
      <div id="dashboard" class="grid" hidden>
        <section class="card">
          <div class="card-head">
            <span class="card-label">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 13h5l1.5 3h5L16 13h5" />
                <path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z" />
              </svg>
              Inboxes
            </span>
            <button id="check" class="secondary small-button">Check now</button>
          </div>
          <div id="accounts"></div>
          <div class="actions">
            <a id="gmail" class="button" href="/oauth/start/gmail"
              >+ Connect Gmail</a
            ><a
              id="outlook"
              class="button secondary"
              href="/oauth/start/outlook"
              >+ Connect Outlook</a
            >
          </div>
          <p id="provider-status" class="small"></p>
        </section>
        <section class="card">
          <div class="card-head">
            <span class="card-label">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="12" rx="2" />
                <path d="M8 20h8M12 16v4" />
              </svg>
              Display
            </span>
          </div>
          <div class="display-preview">
            <div class="display-heading">EMAIL CODE DISPLAY</div>
            <div class="display-code">123456</div>
          </div>
          <div class="actions">
            <button id="test">Send test code</button
            ><a href="/cdn-cgi/access/logout" class="button secondary"
              >Sign out</a
            >
          </div>
          <p id="last-poll" class="small"></p>
        </section>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <footer>
        <a href="/privacy.html">Privacy details</a>
      </footer>
    </main>
  </body>
</html>
